[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-bot"
version = "1.1.0"
description = "Sentra Discord community bot"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
sentra = "sentra.bot:main"

[tool.setuptools]
packages = ["sentra", "sentra.cogs", "sentra.db", "sentra.music"]
package-dir = {sentra = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
